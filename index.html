            "height": 512

        {
          "@type": "WebSite",
          "@id": "https://hamhao.com/#website",

          "publisher": { "@id": "https://hamhao.com/#organization" },
          "inLanguage": ["en", "zh-CN"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://hamhao.com/browse?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Course",

          "educationalLevel": ["Beginner", "Intermediate", "Advanced"],
          "inLanguage": "zh-CN",

            "HSK exam preparation",
            "Chinese character recognition",
            "Pinyin pronunciation",
            "Chinese sentence structure"

          "coursePrerequisites": "No prior knowledge required for HSK 1",
          "hasCourseInstance": [
            {
              "@type": "CourseInstance",
              "name": "HSK 1 - Beginner Chinese",
              "description": "150 essential Chinese words for beginners",
              "courseMode": "online",
              "courseWorkload": "PT20H"

              "name": "HSK 5 - Advanced Chinese",

              "courseMode": "online",
              "courseWorkload": "PT200H"
            },
            {
              "@type": "CourseInstance",
              "name": "HSK 6 - Mastery Chinese",
              "description": "5000+ words for near-native proficiency",
              "courseMode": "online",

              "@type": "Offer",

              "priceCurrency": "USD"

        {
          "@type": "WebApplication",
          "@id": "https://hamhao.com/#app",
          "name": "HamHao Chinese Learning App",
          "url": "https://hamhao.com",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Interactive flashcards with spaced repetition",
            "Multiple choice vocabulary quizzes",
            "Sentence practice with context",
            "Per-character pinyin on hover",
            "Native audio pronunciation",
            "Progress tracking",
            "HSK level filtering"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://hamhao.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is HSK?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "HSK (Hanyu Shuiping Kaoshi) is the standardized Chinese proficiency test for non-native speakers. It has 6 levels, from HSK 1 (beginner) to HSK 6 (advanced). HamHao covers vocabulary for all 6 levels."
              }
            },
            {
              "@type": "Question",
              "name": "Is HamHao free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! HamHao offers free access to HSK 1 vocabulary with all study modes including flashcards, quizzes, and sentence practice. Premium access unlocks HSK levels 2-6."
              }
            },
            {
              "@type": "Question",
              "name": "What study modes does HamHao offer?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "HamHao offers 5 study modes: Browse (search and explore vocabulary), Practice (focused 10-card sessions), Sentences (learn vocabulary in context), Flashcards (quick review with flip cards), and Quiz (multiple choice tests)."
              }
            },
            {
              "@type": "Question",
              "name": "Does HamHao have audio pronunciation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! HamHao uses text-to-speech technology to provide native Mandarin pronunciation for all words and example sentences. You can also hover or tap on individual characters to see their pinyin."
              }
            }
          ]
